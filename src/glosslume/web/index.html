<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosslume</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8791c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff7e6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span><b>Glosslume</b></div>

    <div class="import">
      <form id="urlForm" class="row">
        <input id="urlIn" type="text" placeholder="" autocomplete="off" spellcheck="false">
        <button class="btn primary" type="submit" id="urlGo"></button>
      </form>
      <div class="row gap">
        <button class="btn" id="fileBtn"></button>
        <button class="btn" id="pasteBtn"></button>
        <input id="fileIn" type="file" accept=".pdf,.docx,.txt,.md,.html,.htm" hidden>
      </div>
      <div class="hint" id="importHint"></div>
    </div>

    <div class="shelf-title" id="shelfTitle"></div>
    <div class="shelf" id="shelf"></div>

    <nav class="bottom">
      <button class="navb" data-view="vocab" id="navVocab"></button>
      <button class="navb" data-view="settings" id="navSettings"></button>
    </nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="card" id="card" hidden></div>
<button class="selbtn" id="selBtn" hidden></button>
<aside class="drawer" id="drawer" hidden>
  <header><b id="drawerTitle"></b><button class="x" id="drawerX" aria-label="close">×</button></header>
  <div class="quote" id="drawerQuote"></div>
  <div class="dbody" id="drawerBody"></div>
  <footer id="drawerFoot"></footer>
</aside>
<div class="toast" id="toast" hidden></div>
<dialog id="pasteDlg">
  <form method="dialog" id="pasteForm">
    <input id="pasteTitle" type="text" autocomplete="off">
    <textarea id="pasteText" rows="10"></textarea>
    <div class="row end"><button class="btn" value="cancel" id="pasteCancel"></button><button class="btn primary" value="ok" id="pasteOk"></button></div>
  </form>
</dialog>
<div class="drop" id="drop" hidden></div>
<script src="/js/app.js"></script>
</body>
</html>
