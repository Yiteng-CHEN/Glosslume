[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glosslume"
version = "0.1.0"
description = "Read papers in their original language and click any word to see what it means in that sentence. Runs on your own local model; cloud models are optional."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []          # core is stdlib-only
keywords = ["reading", "language-learning", "translation", "local-ai", "llm", "papers", "vocabulary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.optional-dependencies]
pdf = ["pypdf"]            # server-side text extraction for PDF files
keychain = ["keyring"]     # store cloud API keys in the system keychain
all = ["pypdf", "keyring"]
dev = ["pytest"]

[project.scripts]
glosslume = "glosslume.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glosslume = ["localmodel/*.json", "web/*", "web/css/*", "web/js/*", "web/vendor/pdfjs/*", "web/vendor/pdfjs/cmaps/*", "web/vendor/pdfjs/standard_fonts/*", "web/vendor/pdfjs/wasm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
